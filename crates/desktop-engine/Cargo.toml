[package]
name = "desktop-engine"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Puppet Windows desktop engine (pinned 0f790be, Puppet 8.0.0) as a library: UIA inspection, background-safe input, capture"
rust-version = "1.95"

[lib]
name = "desktop_engine"
path = "src/lib.rs"

[dependencies]
mjpeg-avi = { path = "../mjpeg-avi" }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
serde_json = { version = "1", features = ["preserve_order"] }
png = "0.18"
jpeg-encoder = "0.7"
base64 = "0.23"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }
