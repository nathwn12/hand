[package]
name = "browser-engine"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Gladius browser engine (pinned 59c6d77, Gladius 0.8.0) as a library: headless Chrome over CDP"
rust-version = "1.88"

[lib]
name = "browser_engine"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "stream", "rustls-tls-native-roots"] }
futures-util = "0.3"
serde_json = "1"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
base64 = "0.23"
