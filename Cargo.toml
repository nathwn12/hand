[workspace]
members = ["crates/browser-engine", "crates/desktop-engine"]
resolver = "2"

[package]
name = "hand"
version = "0.3.1"
edition = "2021"
license = "MIT"
rust-version = "1.88"
description = "hand: one MCP server for headless browser testing (CDP) and Windows desktop computer use"
repository = "https://github.com/nathwn12/hand"

[[bin]]
name = "hand"
path = "src/main.rs"

[dependencies]
browser-engine = { path = "crates/browser-engine" }
desktop-engine = { path = "crates/desktop-engine" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"
incremental = true
opt-level = 0

[profile.test]
inherits = "dev"
