  <script>
  (() => {
    const grid = document.getElementById('grid');
    const status = document.getElementById('status');
    let activations = 0;
    grid.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-hand-control]');
      if (!button) return;
      activations += 1;
      status.textContent = 'last activated: ' + button.dataset.label + ' (' + activations + ')';
    });
  })();
