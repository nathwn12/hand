<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>form-factor-adaptation</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}
#v{--form:full}#v.compact{--form:compact}</style>
</head><body>
<button id="c">Compact mode</button><div id="v">Content</div><output id="out">idle</output>
<script>
document.getElementById('c').onclick=()=>{document.getElementById('v').classList.add('compact');document.getElementById('out').textContent=getComputedStyle(document.getElementById('v')).getPropertyValue('--form').trim();};
</script>
</body></html>
