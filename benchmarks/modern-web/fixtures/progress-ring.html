<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>progress-ring</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}</style>
</head><body>
<button id="s">Spin</button><div id="r" role="progressbar" aria-valuenow="0">0%</div><output id="out">idle</output>
<script>
document.getElementById('s').onclick=()=>{document.getElementById('r').setAttribute('aria-valuenow','50');document.getElementById('out').textContent='50';};
</script>
</body></html>
