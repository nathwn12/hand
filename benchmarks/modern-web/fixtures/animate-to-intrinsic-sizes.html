<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>animate-to-intrinsic-sizes</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}
#p{height:0;overflow:hidden}</style>
</head><body>
<button id="e">Expand</button><div id="p">Content</div><output id="out">idle</output>
<script>
document.getElementById('e').onclick=()=>{document.getElementById('p').style.height='auto';document.getElementById('out').textContent='expanded';};
</script>
</body></html>
