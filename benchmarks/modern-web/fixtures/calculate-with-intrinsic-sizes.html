<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>calculate-with-intrinsic-sizes</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}
#x{width:min-content}</style>
</head><body>
<button id="m">Measure</button><div id="x">Some text here</div><output id="out">idle</output>
<script>
document.getElementById('m').onclick=()=>{const w=getComputedStyle(document.getElementById('x')).width;document.getElementById('out').textContent=w==='0px'?'zero':'measured';};
</script>
</body></html>
