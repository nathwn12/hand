<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>form-associated-custom-elements</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}</style>
</head><body>
<form id="f"><my-input id="mi" name="token"></my-input><button type="submit" id="sub">Submit form</button></form><output id="out">idle</output>
<script>
class Field extends HTMLElement{static formAssociated=true;constructor(){super();this.internals=this.attachInternals();}connectedCallback(){const s=this.attachShadow({mode:'open'});s.innerHTML='<input aria-label="Token">';s.querySelector('input').addEventListener('input',e=>this.internals.setFormValue(e.target.value));}}customElements.define('my-input',Field);document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('out').textContent=new FormData(e.target).get('token')||'empty';});
</script>
</body></html>
