<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>scroll-progress-indicator</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}
</style>
</head><body>
<button id="p">Update progress</button><div id="bar" role="progressbar" aria-valuenow="0">0%</div><output id="out">idle</output>
<script>
document.getElementById('p').onclick=()=>{document.getElementById('bar').setAttribute('aria-valuenow','25');document.getElementById('out').textContent='25';};
</script>
</body></html>
