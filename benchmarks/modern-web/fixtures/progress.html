<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>progress</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}</style>
</head><body>
<button id="a">Advance</button><div id="p" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="3">0 of 3</div><output id="out">idle</output>
<script>
let n=0;document.getElementById('a').onclick=()=>{n++;document.getElementById('p').setAttribute('aria-valuenow',String(n));document.getElementById('out').textContent=String(n);};
</script>
</body></html>
