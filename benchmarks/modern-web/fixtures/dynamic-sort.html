<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>dynamic-sort</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}</style>
</head><body>
<label for="order">Order</label><select id="order"><option value="asc">Ascending</option><option value="desc">Descending</option></select><button id="apply">Apply sort</button><output id="out">idle</output>
<script>
document.getElementById('apply').onclick=()=>{document.getElementById('out').textContent=document.getElementById('order').value;};
</script>
</body></html>
