<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>accessible-generated-content</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}
#fav::after{content:" ★"}</style>
</head><body>
<button id="fav" aria-label="Add favourite">☆</button><output id="out">idle</output>
<script>
document.getElementById('fav').onclick=()=>{document.getElementById('out').textContent='added';};
</script>
</body></html>
