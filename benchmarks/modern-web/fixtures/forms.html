<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>forms</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}</style>
</head><body>
<form id="f"><label for="n">Name</label><input id="n" name="name"><button type="submit">Submit form</button></form><output id="out">idle</output>
<script>
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('out').textContent='hello '+document.getElementById('n').value;});
</script>
</body></html>
