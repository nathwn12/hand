<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ime-safe-enter-submit</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}</style>
</head><body>
<form id="f"><label for="q">Query</label><input id="q"><button type="submit">Search</button></form><output id="out">idle</output>
<script>
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();document.getElementById('out').textContent='searched '+e.target.value;}});
</script>
</body></html>
