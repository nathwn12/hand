<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>shadow-dom</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}</style>
</head><body>
<div id="host"></div><output id="out">idle</output>
<script>
const s=document.getElementById('host').attachShadow({mode:'open'});s.innerHTML='<button id="b">Shadow button</button>';s.getElementById('b').onclick=()=>{document.getElementById('out').textContent='shadow clicked';};
</script>
</body></html>
