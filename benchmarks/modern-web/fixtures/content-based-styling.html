<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>content-based-styling</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}
#wrap{--layout:one}#wrap:has(img){--layout:two}</style>
</head><body>
<div id="wrap"><div id="kids"></div></div><button id="add">Add image</button><output id="out">idle</output>
<script>
document.getElementById('add').onclick=()=>{document.getElementById('kids').innerHTML='<img alt="dot" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">';document.getElementById('out').textContent=getComputedStyle(document.getElementById('wrap')).getPropertyValue('--layout').trim();};
</script>
</body></html>
