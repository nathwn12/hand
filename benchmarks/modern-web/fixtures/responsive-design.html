<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>responsive-design</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}
#c{--form:full}#c.compact{--form:compact}</style>
</head><body>
<button id="t">Toggle compact</button><div id="c">Content</div><output id="out">idle</output>
<script>
document.getElementById('t').onclick=()=>{document.getElementById('c').classList.add('compact');document.getElementById('out').textContent=getComputedStyle(document.getElementById('c')).getPropertyValue('--form').trim();};
</script>
</body></html>
