<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>hovercard</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}</style>
</head><body>
<button id="h">Hover me</button><div id="card" hidden>Hover card text</div><output id="out">idle</output>
<script>
document.getElementById('h').addEventListener('mouseenter',()=>{document.getElementById('card').hidden=false;document.getElementById('out').textContent='shown';});
</script>
</body></html>
