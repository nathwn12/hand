<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>light-dismiss-a-dialog</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}</style>
</head><body>
<button id="o">Open dialog</button><dialog id="d"><button id="x">Dismiss</button></dialog><output id="out">idle</output>
<script>
document.getElementById('o').onclick=()=>{document.getElementById('d').showModal();document.getElementById('out').textContent='open';};document.getElementById('x').onclick=()=>{document.getElementById('d').close();document.getElementById('out').textContent='dismissed';};
</script>
</body></html>
