<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>slider</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}</style>
</head><body>
<label for="v">Volume</label><input id="v" type="range" min="0" max="10" value="5"><output id="out">idle</output>
<script>
document.getElementById('v').addEventListener('input',e=>{document.getElementById('out').textContent=e.target.value;});
</script>
</body></html>
