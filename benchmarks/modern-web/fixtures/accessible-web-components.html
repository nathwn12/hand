<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>accessible-web-components</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}</style>
</head><body>
<my-toggle id="t"></my-toggle><output id="out">idle</output>
<script>
class Toggle extends HTMLElement{connectedCallback(){const s=this.attachShadow({mode:'open'});s.innerHTML='<button role="switch" aria-checked="false" aria-label="Accessible toggle">Toggle</button>';s.querySelector('button').onclick=e=>{const on=e.target.getAttribute('aria-checked')!=='true';e.target.setAttribute('aria-checked',String(on));document.getElementById('out').textContent=on?'on':'off';};}}customElements.define('my-toggle',Toggle);
</script>
</body></html>
