<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>declarative-dialog-popover-control</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}</style>
</head><body>
<button id="p" popovertarget="pop">Toggle popover</button><div id="pop" popover>Popover text</div><output id="out">idle</output>
<script>
document.getElementById('pop').addEventListener('toggle',e=>{document.getElementById('out').textContent=e.newState;});
</script>
</body></html>
