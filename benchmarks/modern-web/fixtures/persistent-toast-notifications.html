<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>persistent-toast-notifications</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}</style>
</head><body>
<button id="s">Show toast</button><div id="toast" role="status" hidden>Saved successfully</div><output id="out">idle</output>
<script>
document.getElementById('s').onclick=()=>{document.getElementById('toast').hidden=false;document.getElementById('out').textContent='Shown';};
</script>
</body></html>
