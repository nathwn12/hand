<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>brand-consistent-forms</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}</style>
</head><body>
<label for="u">Username</label><input id="u" autocomplete="username"><output id="out">idle</output>
<script>
document.getElementById('u').addEventListener('input',e=>{document.getElementById('out').textContent='length '+e.target.value.length;});
</script>
</body></html>
