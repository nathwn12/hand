<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>individual-transform-properties</title>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px}button{margin:4px}output{display:block;margin-top:12px}
</style>
</head><body>
<button id="r">Rotate box</button><div id="box">Box</div><output id="out">idle</output>
<script>
document.getElementById('r').onclick=()=>{document.getElementById('box').style.rotate='45deg';document.getElementById('out').textContent=getComputedStyle(document.getElementById('box')).rotate;};
</script>
</body></html>
