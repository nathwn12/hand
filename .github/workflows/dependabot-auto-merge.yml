name: dependabot-auto-merge

# Auto-merge is armed, never forced: GitHub's native auto-merge still waits for
# every required check and review. No PR code is checked out or executed here;
# only the API and Dependabot's signed metadata are read.
on:
  # zizmor: ignore[dangerous-triggers] -- Dependabot PRs need a write token to arm merge; no PR code runs
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    # Dependabot only, from this repository: the PR author in GitHub's event
    # payload is the account that opened it, unlike the spoofable actor context.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == github.event.pull_request.head.repo.full_name
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Classify the Dependabot bump
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check the default branch has required checks
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          body="$(gh api "repos/$GH_REPO/branches/main/protection" 2>/dev/null)" || {
            echo "has_gate=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          checks="$(printf '%s' "$body" | jq -r '.required_status_checks.contexts // [] | length')"
          if [ "$checks" -gt 0 ]; then
            echo "has_gate=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Leave an ungated minor/patch PR for review
        # Majors get their own review comment below; no second notice for them.
        if: steps.gate.outputs.has_gate == 'false' && steps.meta.outputs.update-type != 'semver-major'
        shell: bash
        run: |
          gh pr comment "$PR_URL" --body "No required status checks on main, so auto-merge is not armed. Leaving this PR for review."

      - name: Arm squash auto-merge (patch and minor only)
        if: steps.gate.outputs.has_gate == 'true' && (steps.meta.outputs.update-type == 'semver-patch' || steps.meta.outputs.update-type == 'semver-minor')
        shell: bash
        run: |
          gh pr merge --auto --squash "$PR_URL"

      - name: Flag a major for review
        if: steps.meta.outputs.update-type == 'semver-major'
        shell: bash
        env:
          DEPS: ${{ steps.meta.outputs.dependency-names }}
          FROM: ${{ steps.meta.outputs.previous-version }}
          TO: ${{ steps.meta.outputs.new-version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # One comment per PR, replaced on re-runs: a batch of majors is then
          # reviewable from a single label filter without comment noise.
          marker='<!-- dependabot-major-review -->'
          files="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')"
          patch="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].patch // ""')"

          # Added lines naming the bumped dependency are the concrete review
          # surface: the new ref and the inputs pinned on that step.
          refs=()
          deps_csv="$DEPS"
          IFS=',' read -ra deps <<< "$deps_csv"
          for dep in "${deps[@]}"; do
            dep="$(printf '%s' "$dep" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -n "$dep" ] || continue
            hits="$(grep '^+' <<< "$patch" | grep -F -- "$dep" | grep -v '^+++' || true)"
            if [ -n "$hits" ]; then
              refs+=("$hits")
            fi
          done

          {
            echo "$marker"
            echo '### Major dependency bump - review required'
            echo
            echo "- **Bump:** $DEPS $FROM -> $TO"
            echo '- **Auto-merge:** not armed. Majors are never auto-merged here.'
            echo '- **Files changed:**'
            if [ -n "$files" ]; then
              while IFS= read -r file; do
                [ -n "$file" ] && echo "  - $file"
              done <<< "$files"
            fi
            echo '- **What the bump requires (added lines from the diff):**'
            if [ "${#refs[@]}" -gt 0 ]; then
              for ref in "${refs[@]}"; do
                echo "  - $ref"
              done
            else
              echo '  - no direct ref found in added lines; review the full diff'
            fi
            echo '- **Before merge:** check breaking changes against the inputs above and keep all required checks green.'
          } > major-comment.md

          gh label create dependencies-major --color B60205 --description "Major dependency bump; review required" --force >/dev/null 2>&1 || true
          gh pr edit "$PR_URL" --add-label dependencies-major

          existing="$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1 || true)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" -f body="$(cat major-comment.md)" >/dev/null
          else
            gh pr comment "$PR_URL" --body-file major-comment.md
          fi
