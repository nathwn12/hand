# Release lane: push to main publishes a new version by OIDC trusted publishing.
# A version already on the registry is a skip only when its gitHead names this
# source commit; a conflicting immutable tag is refused before publish. The tag
# is created at the published source commit, once, and never moved.
# workflow_dispatch is the escape hatch. The full gate is local; this job only
# builds, packs, proves, publishes and tags. No token, OTP or manual publish.
#
# No GitHub Release page exists for this product, and none may be created here.
# hand is npm-only: the server binary ships inside the npm tarball, so the npm
# registry is the download. A Releases page would be a second, stale home for
# the same fact (AGENTS.md public surface). This lane writes exactly two
# artifacts -- the npm version and the immutable v* tag -- and makes no call
# to the Releases API. Do not add a release action or a Releases API write to
# this workflow; if the shipping shape ever changes, record that decision in
# an ADR and the spec before editing this file.
name: publish

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The full release gate is expensive (~13 minutes on two cold images). When
  # this version is already on the registry, both ci and publish are pure
  # overhead. This cheap job lets release.mjs make the identity call; it never
  # reimplements version or tag rules, and a lookup that cannot run fails the
  # job rather than silently skipping or repeating a release.
  decide:
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm install -g npm@11.21.3 # zizmor: ignore[adhoc-packages] -- pinned release toolchain, not a project dependency
      - name: Decide from registry and tag identity
        id: decide
        shell: bash
        run: |
          node npm/release.mjs --status
          node --input-type=module - <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync, appendFileSync } from "node:fs";
          const { releaseIdentityDecision } = await import("./npm/release.mjs");

          function capture(cmd, args) {
            try {
              return { ok: true, out: execFileSync(cmd, args, { cwd: process.cwd(), encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] }) };
            } catch (error) {
              return { ok: false, out: [(error.stdout || ""), (error.stderr || ""), (error.message || "")].join("\n") };
            }
          }

          const version = process.env.DECIDE_VERSION || JSON.parse(readFileSync("npm/package.json", "utf8")).version;
          const head = capture("git", ["rev-parse", "HEAD"]);
          if (!head.ok) { console.error("FAIL decide: cannot read HEAD: " + head.out.trim()); process.exit(1); }
          const headSha = head.out.trim().toLowerCase();

          const view = capture(process.env.ComSpec || "cmd.exe", ["/d", "/c", "npm", "view", "hand-mcp@" + version, "gitHead", "--json"]);
          let registry;
          if (view.ok) {
            let doc;
            try { doc = JSON.parse(view.out); } catch { doc = null; }
            const raw = Array.isArray(doc) ? doc[0] : doc;
            const gitHead = typeof raw === "string" ? raw.toLowerCase() : null;
            registry = gitHead && /^[0-9a-f]{7,40}$/.test(gitHead)
              ? { status: "present", gitHead, version }
              : { status: "unavailable", reason: "npm view returned no usable gitHead" };
          } else {
            registry = /E404|No match found for version|No matching version found|version not found/i.test(view.out)
              ? { status: "absent", reason: "npm view: version not on registry" }
              : { status: "unavailable", reason: view.out.trim() };
          }

          const ls = capture("git", ["ls-remote", "--tags", "origin", "refs/tags/v" + version + "*"]);
          let tag;
          if (!ls.ok) {
            tag = { status: "unavailable", reason: ls.out.trim() };
          } else {
            const ref = "refs/tags/v" + version;
            const cols = ls.out.split(/\r?\n/).filter(Boolean).map((line) => line.split(/\s+/));
            const row = cols.find((c) => c[1] === ref + "^{}") || cols.find((c) => c[1] === ref);
            tag = row && /^[0-9a-f]{40}$/i.test(row[0])
              ? { status: "present", commit: row[0].toLowerCase() }
              : { status: "absent", reason: "no remote tag v" + version };
          }

          const decision = releaseIdentityDecision({ version, head: headSha, registry, tag });
          console.log("decide: version=" + version + " head=" + headSha.slice(0, 8) + " registry=" + registry.status + (registry.gitHead ? " gitHead=" + registry.gitHead.slice(0, 8) : "") + " tag=" + tag.status + (tag.commit ? " commit=" + tag.commit.slice(0, 8) : ""));
          console.log("decide: action=" + decision.action + " reason=" + decision.reason);
          if (decision.action === "fail") { console.error("FAIL decide: " + decision.reason); process.exit(1); }
          const shouldPublish = decision.action === "publish" ? "true" : "false";
          console.log("should_publish=" + shouldPublish);
          const output = process.env.GITHUB_OUTPUT;
          if (output) appendFileSync(output, "should_publish=" + shouldPublish + "\ndecision=" + decision.action + "\n");
          NODE

  # Real-browser and desktop suites run advisory on pull requests in ci.yml,
  # never in a release. This gate verifies the artifact that ships: deterministic
  # tests, then the packed tarball itself, so a VM network policy never vetoes
  # a published package.
  ci:
    needs: decide
    if: needs.decide.outputs.should_publish == 'true'
    # Pinned image: a release gate must not change under the project.
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm install -g npm@11.21.3 # zizmor: ignore[adhoc-packages] -- pinned release toolchain, not a project dependency
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo test --locked -p mjpeg-avi
      - run: cargo test --locked -p desktop-engine -- --skip live_
      - run: cargo test -p hand --test discovery
      - run: cargo test -p hand --test no_steal
      - run: HAND_BASELINE_SKIP_LIVE=1 node --test baseline/test/*.test.mjs
        shell: bash
      # The release gate runs only checks that do not need an interactive desktop
      # or a real browser; desktop/clipboard conformance is exercised on pull
      # requests and locally.
      - run: cargo build --locked --release
      - name: Restore pinned browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~\AppData\Local\gladius\chromium
          key: chromium-win64-158.0.8127.36-${{ hashFiles('crates/browser-engine/scripts/chromium-manifest.json') }}
      - name: Provision pinned browser
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File crates\browser-engine\scripts\fetch-chromium.ps1
      # The release contract is the packed artifact: this starts the MCP from
      # the tarball and proves tools/list plus a data: URL navigation.
      - run: node npm/release.mjs --check
      - run: node baseline/scripts/compare-catalog.mjs --serve target\release\hand.exe
      - run: node docs-check.mjs --strict
  publish:
    needs: [ci]
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked] -- the tag step pushes with this token
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm install -g npm@11.21.3 # zizmor: ignore[adhoc-packages] -- pinned release toolchain, not a project dependency
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - id: publish
        run: node npm/release.mjs --publish --ci
      - name: Tag the published source commit
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.publish.outputs.releaseVersion }}
          RELEASE_SOURCE_COMMIT: ${{ steps.publish.outputs.releaseSourceCommit }}
          RELEASE_TAG_COMMIT: ${{ steps.publish.outputs.releaseTagCommit }}
          RELEASE_TAG_MODE: ${{ steps.publish.outputs.releaseTagMode }}
        run: |
          $v = $env:RELEASE_VERSION
          $source = $env:RELEASE_SOURCE_COMMIT
          $expected = if ($env:RELEASE_TAG_MODE -eq 'leave') { $env:RELEASE_TAG_COMMIT } else { $source }
          if (-not $v -or $expected -notmatch '^[0-9a-f]{40}$') { throw "publish step did not report a full source commit" }
          $ref = "refs/tags/v$v"
          $remote = @(git ls-remote --tags origin "$ref*")
          $deref = @($remote | Where-Object { $_ -like "*$ref^{}" } | Select-Object -First 1)
          if ($deref.Count -eq 0) { $deref = @($remote | Where-Object { $_ -like "* $ref" } | Select-Object -First 1) }
          if ($deref.Count -gt 0) {
            $commit = ($deref[0] -split '\s+')[0].ToLowerInvariant()
            if ($commit -ne $expected) { throw "immutable tag v$v points at $commit, not identity $expected" }
            if ($env:RELEASE_TAG_MODE -eq 'leave') {
              Write-Host "v$v is the closed historical identity exception; tag and registry untouched"
            } else {
              Write-Host "tag v$v already names $source"
            }
            exit 0
          }
          if ($env:RELEASE_TAG_MODE -eq 'leave') { throw "historical identity for v$v expects an existing tag" }
          git cat-file -e "$source^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git fetch --depth 1 origin $source
            if ($LASTEXITCODE -ne 0) { throw "cannot fetch published source $source" }
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$v" $source
          git push origin "refs/tags/v$v"
