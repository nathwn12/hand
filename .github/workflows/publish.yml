name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo test -p browser-engine
      - run: cargo test -p desktop-engine -- --skip live_
      - run: node baseline/scripts/compare-catalog.mjs --serve target/debug/hand.exe --baseline hand
  publish:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11
      - uses: dtolnay/rust-toolchain@stable
      - run: node npm/release.mjs --publish --ci
