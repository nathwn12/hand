# Release lane: push to main publishes a new version by OIDC trusted publishing.
# A version already on the registry is a skip only when its gitHead names this
# source commit; a conflicting immutable tag is refused before publish. The tag
# is created at the published source commit, once, and never moved.
# workflow_dispatch is the escape hatch. The full gate is local; this job only
# builds, packs, proves, publishes and tags. No token, OTP or manual publish.
#
# No GitHub Release page exists for this product, and none may be created here.
# hand is npm-only: the server binary ships inside the npm tarball, so the npm
# registry is the download. A Releases page would be a second, stale home for
# the same fact (AGENTS.md public surface). This lane writes exactly two
# artifacts -- the npm version and the immutable v* tag -- and makes no call
# to the Releases API. Do not add a release action or a Releases API write to
# this workflow; if the shipping shape ever changes, record that decision in
# an ADR and the spec before editing this file.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p browser-engine
      - run: cargo test --locked -p desktop-engine -- --skip live_
      - run: HAND_BASELINE_SKIP_LIVE=1 node --test baseline/test/
        shell: bash
      - run: cargo build --locked --release
      - run: node baseline/scripts/compare-catalog.mjs --serve target\release\hand.exe
      - run: node docs-check.mjs --strict
  publish:
    needs: [ci]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11
      - uses: dtolnay/rust-toolchain@stable
      - id: publish
        run: node npm/release.mjs --publish --ci
      - name: Tag the published source commit
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.publish.outputs.releaseVersion }}
          RELEASE_SOURCE_COMMIT: ${{ steps.publish.outputs.releaseSourceCommit }}
          RELEASE_TAG_COMMIT: ${{ steps.publish.outputs.releaseTagCommit }}
          RELEASE_TAG_MODE: ${{ steps.publish.outputs.releaseTagMode }}
        run: |
          $v = $env:RELEASE_VERSION
          $source = $env:RELEASE_SOURCE_COMMIT
          $expected = if ($env:RELEASE_TAG_MODE -eq 'leave') { $env:RELEASE_TAG_COMMIT } else { $source }
          if (-not $v -or $expected -notmatch '^[0-9a-f]{40}$') { throw "publish step did not report a full source commit" }
          $ref = "refs/tags/v$v"
          $remote = @(git ls-remote --tags origin "$ref*")
          $deref = @($remote | Where-Object { $_ -like "*$ref^{}" } | Select-Object -First 1)
          if ($deref.Count -eq 0) { $deref = @($remote | Where-Object { $_ -like "* $ref" } | Select-Object -First 1) }
          if ($deref.Count -gt 0) {
            $commit = ($deref[0] -split '\s+')[0].ToLowerInvariant()
            if ($commit -ne $expected) { throw "immutable tag v$v points at $commit, not identity $expected" }
            if ($env:RELEASE_TAG_MODE -eq 'leave') {
              Write-Host "v$v is the closed historical identity exception; tag and registry untouched"
            } else {
              Write-Host "tag v$v already names $source"
            }
            exit 0
          }
          if ($env:RELEASE_TAG_MODE -eq 'leave') { throw "historical identity for v$v expects an existing tag" }
          git cat-file -e "$source^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git fetch --depth 1 origin $source
            if ($LASTEXITCODE -ne 0) { throw "cannot fetch published source $source" }
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$v" $source
          git push origin "refs/tags/v$v"
