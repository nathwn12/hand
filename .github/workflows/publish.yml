# Release lane: push to main publishes a new version by OIDC trusted publishing.
# A version already on the registry is a skip, never a second publish. The tag
# is created once and never moved. workflow_dispatch is the escape hatch.
# The full gate is local; this job only builds, packs, proves and publishes.
# No token, no OTP, no manual npm publish.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11
      - uses: dtolnay/rust-toolchain@stable
      - run: node npm/release.mjs --publish --ci
      - name: Tag the published version
        shell: pwsh
        run: |
          $v = (Get-Content npm/package.json -Raw | ConvertFrom-Json).version
          $remote = git ls-remote --tags origin "refs/tags/v$v"
          if ($remote) { Write-Host "tag v$v already exists"; exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$v"
          git push origin "v$v"
