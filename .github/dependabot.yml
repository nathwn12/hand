# Version updates for the real dependency surfaces only.
# npm/package.json declares no dependencies; there is nothing to update there.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      routine:
        update-types:
          - "patch"
          - "minor"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      routine:
        update-types:
          - "patch"
          - "minor"
